[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mystic-pointer"
version = "0.1.0"
description = "Open source cross-platform screen-aware AI pointer assistant"
authors = [{ name = "Mystic Pointer Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "markdown>=3.5",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "mss>=9.0.0",
    "jeepney>=0.9.0; sys_platform == 'linux'",
]

[project.scripts]
mystic-pointer = "mystic_pointer.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["mystic_pointer", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
